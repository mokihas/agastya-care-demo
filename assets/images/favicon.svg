<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Deep Pine Teal Base -->
  <rect width="64" height="64" rx="16" fill="#0C4E48"/>
  
  <!-- Subtle Inset Border -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#FAF8F4" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Minimalist Clean Cross -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#FAF8F4" stroke-width="6" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="#FAF8F4" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Warm Terracotta Focal Point -->
  <circle cx="42" cy="22" r="4.5" fill="#C85A32"/>
</svg>
